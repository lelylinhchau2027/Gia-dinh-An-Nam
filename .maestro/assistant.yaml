# Only run on the CI/demo simulator. clearState removes that app's local data.
appId: vn.giadinhanam.family
---
- launchApp:
    clearState: true
- openLink: giadinhannam://em-be
- tapOn:
    text: 'Open'
    optional: true
- extendedWaitUntil:
    visible:
      id: assistant-scroll
    timeout: 30000
- takeScreenshot: assistant-profile
- scrollUntilVisible:
    element:
      id: tool-milk
    centerElement: true
- takeScreenshot: assistant-icons
- tapOn:
    id: tool-milk
- tapOn:
    id: add-care-record
- tapOn:
    id: record-amount
- inputText: '120'
- assertVisible:
    id: record-amount
    text: '120'
- assertVisible:
    id: keyboard-done
- takeScreenshot: milk-number-keyboard
- tapOn:
    id: keyboard-done
- scrollUntilVisible:
    element:
      id: record-note
- tapOn:
    id: record-note
- inputText: "Native keyboard check\nSecond line\nThird line"
- assertVisible:
    id: record-note
- assertVisible:
    id: keyboard-done
- takeScreenshot: milk-note-keyboard
- tapOn:
    id: keyboard-done
- scrollUntilVisible:
    element:
      id: save-care-record
- tapOn:
    id: save-care-record
- extendedWaitUntil:
    visible:
      id: add-care-record
    timeout: 30000
- assertVisible: '120 ml'
- takeScreenshot: milk-saved
- stopApp
- launchApp
- openLink: giadinhannam://assistant/milk
- assertVisible: '120 ml'
- openLink: giadinhannam://child/measure
- tapOn:
    id: measure-weight
- inputText: '8.2'
- takeScreenshot: growth-keyboard
- tapOn:
    id: keyboard-done
- openLink: giadinhannam://assistant/teeth
- assertVisible: '0 / 20 răng đã ghi'
- takeScreenshot: teeth-original-shapes
- openLink: giadinhannam://em-be
- tapOn:
    id: choose-child
- tapOn:
    id: add-child
- tapOn:
    id: child-name
- inputText: 'Be Hai'
- tapOn:
    id: keyboard-done
- scrollUntilVisible:
    element:
      id: save-child
- tapOn:
    id: save-child
- extendedWaitUntil:
    visible:
      id: choose-child
    timeout: 30000
- takeScreenshot: second-child
- openLink: giadinhannam://assistant/milk
- extendedWaitUntil:
    visible:
      id: add-care-record
    timeout: 30000
- assertNotVisible: '120 ml'
- openLink: giadinhannam://family/message
- extendedWaitUntil:
    visible: 'Lời nhắc của hai người'
    timeout: 30000
- assertNotVisible:
    id: chat-input
- tapOn: 'Tạo lời nhắc'
- tapOn: 'Chọn giờ'
- tapOn: 'Giờ 07'
- tapOn: 'Phút 30'
- tapOn: 'Chọn 07:30'
- takeScreenshot: reminder-time-picker
- openLink: giadinhannam://widgets
- assertVisible: 'Ba kiểu tiện ích'
- takeScreenshot: widget-settings
- openLink: giadinhannam://family/attention
- assertVisible: 'Xác nhận gửi báo nhanh'
- takeScreenshot: attention-confirmation
